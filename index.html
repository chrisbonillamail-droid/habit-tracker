<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#EEF1EA;
    --surface:#FFFFFF;
    --surface-alt:#E3E7DC;
    --ink:#20261F;
    --ink-soft:#5B6358;
    --ink-faint:#8B9384;
    --line:#D3D9C9;
    --accent-done:#3E6B4F;
    --accent-done-soft:#DCE7DD;
    --accent-miss:#BD4A45;
    --accent-miss-soft:#F3DBDA;
    --accent-neutral-bg:#E7E9E1;
    --accent-gold:#B98B2E;
    --radius:14px;
    --shadow: 0 1px 2px rgba(32,38,31,0.06), 0 6px 20px rgba(32,38,31,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    padding:20px 16px 24px;
    padding-bottom:calc(90px + env(safe-area-inset-bottom));
  }
  .tab-screen{ display:none; }
  .tab-screen.active{ display:block; }

  .screen-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:18px;
  }
  .screen-title{
    font-family:'Fraunces',serif;
    font-size:24px;
    font-weight:600;
  }
  .screen-header-actions{ display:flex; align-items:center; gap:8px; }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:18px;
  }
  .topbar-center{ text-align:center; flex:1; cursor:pointer; }
  .nav-arrow{
    width:36px;height:36px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface);
    font-size:18px;
    line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    color:var(--ink);
  }
  .nav-arrow:active{ transform:scale(0.92); }
  .topbar-date{
    font-family:'Fraunces',serif;
    font-size:26px;
    font-weight:600;
    line-height:1.1;
  }
  .topbar-sub{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .btn-add{
    background:var(--ink);
    color:var(--bg);
    border:none;
    border-radius:20px;
    padding:10px 16px;
    font-size:14px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-add:active{ transform:scale(0.97); }
  .btn-icon{
    width:40px;height:40px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface);
    font-size:17px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .btn-icon:active{ transform:scale(0.94); }
  .import-list{ display:flex; flex-direction:column; gap:4px; max-height:44vh; overflow-y:auto; margin-bottom:16px; border:1px solid var(--line); border-radius:12px; padding:6px; background:var(--surface); }
  .import-row{ display:flex; align-items:center; gap:10px; padding:8px 6px; border-bottom:1px solid var(--line); }
  .import-row:last-child{ border-bottom:none; }
  .import-row input[type=checkbox]{ width:18px; height:18px; flex-shrink:0; accent-color: var(--accent-done); }
  .import-row-main{ flex:1; min-width:0; }
  .import-row-name{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .import-row-meta{ font-size:11px; color:var(--ink-soft); }
  .import-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .import-toolbar button{ background:none; border:none; color:var(--accent-done); font-size:13px; font-weight:600; cursor:pointer; padding:4px; }

  .summary{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:20px;
  }
  .summary-ring{
    width:34px;height:34px;border-radius:50%;
    flex-shrink:0;
    background:conic-gradient(var(--accent-done) calc(var(--pct,0)*1%), var(--surface-alt) 0);
    display:flex;align-items:center;justify-content:center;
  }
  .summary-ring::after{
    content:'';
    width:24px;height:24px;border-radius:50%;
    background:var(--surface);
  }
  .summary-text{ font-size:13px; color:var(--ink-soft); }
  .summary-text b{ color:var(--ink); font-weight:600; }

  .group-section{ margin-bottom:22px; }
  .group-header{
    font-family:'Fraunces',serif;
    font-size:15px;
    font-weight:600;
    color:var(--ink-soft);
    margin:0 0 8px 4px;
  }
  .habit-list{ display:flex; flex-direction:column; gap:8px; }
  .updated-divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:6px 2px 2px;
    color:var(--ink-faint);
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .updated-divider::before, .updated-divider::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }

  .habit-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    cursor:pointer;
    transition:opacity .25s ease, transform .25s ease, background .2s ease;
  }
  .habit-row.addressed{ opacity:0.55; }
  .habit-row.dragging{ box-shadow:0 10px 30px rgba(0,0,0,0.3); }
  .drag-placeholder{
    border-radius:var(--radius);
    border:1.5px dashed var(--line);
    background:transparent;
  }
  .drag-handle{
    width:24px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,0.85);
    cursor:grab;
    touch-action:none;
  }
  .habit-main{ flex:1; min-width:0; }
  .habit-name{
    font-size:15px;
    font-weight:700;
    color:#fff;
    text-shadow: -1px -1px 0 rgba(0,0,0,0.55), 1px -1px 0 rgba(0,0,0,0.55), -1px 1px 0 rgba(0,0,0,0.55), 1px 1px 0 rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.35);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .habit-meta{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .habit-streak{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    color:var(--accent-gold);
  }
  .habit-row .habit-meta{
    color:rgba(255,255,255,0.82);
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  .habit-row .habit-streak{ color:#F0D27A; }
  .habit-chevron{ color:rgba(255,255,255,0.85); font-size:18px; flex-shrink:0; }
  .habit-actions{ display:flex; gap:6px; flex-shrink:0; }
  .btn-mark{
    width:36px;height:36px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--accent-neutral-bg);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--ink-faint);
  }
  .btn-mark svg{ display:block; }
  .btn-mark:active{ transform:scale(0.92); }
  .btn-mark.check.active{
    background:var(--accent-done-soft);
    border-color:var(--accent-done);
    color:var(--accent-done);
  }
  .btn-mark.cross.active{
    background:var(--accent-miss-soft);
    border-color:var(--accent-miss);
    color:var(--accent-miss);
  }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty-state h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    color:var(--ink);
    font-size:20px;
    margin-bottom:6px;
  }
  .empty-state p{ font-size:14px; line-height:1.5; margin:0; }

  /* Bottom nav */
  .bottom-nav{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:520px;
    margin:0 auto;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index:6;
  }
  .nav-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    background:none;
    border:none;
    padding:6px 2px;
    cursor:pointer;
    color:var(--ink-faint);
    font-size:11px;
    font-family:'Inter',sans-serif;
    font-weight:600;
  }
  .nav-btn svg{ width:22px; height:22px; }
  .nav-btn.active{ color:var(--accent-done); }
  .nav-btn:active{ transform:scale(0.95); }

  /* Sheets */
  .overlay{
    position:fixed; inset:0;
    background:rgba(32,38,31,0.35);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
    z-index:10;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:520px;
    margin:0 auto;
    background:var(--bg);
    border-radius:20px 20px 0 0;
    box-shadow:0 -8px 30px rgba(0,0,0,0.2);
    transform:translateY(105%);
    transition:transform .3s cubic-bezier(.2,.8,.2,1);
    z-index:11;
    max-height:88vh;
    overflow-y:auto;
    padding:18px 18px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet.show{ transform:translateY(0); }
  .sheet-handle{
    width:36px;height:4px;border-radius:2px;
    background:var(--line);
    margin:0 auto 14px;
  }
  .sheet h3{
    font-family:'Fraunces',serif;
    font-size:20px;
    font-weight:600;
    margin:0 0 16px;
  }
  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input[type=text], .field input[type=number], .field select{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface);
    font-size:15px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }
  .swatches{ display:flex; gap:8px; flex-wrap:wrap; }
  .swatch{
    width:32px;height:32px;border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
  }
  .swatch.selected{ border-color:var(--ink); }
  .segmented{ display:flex; gap:6px; flex-wrap:wrap; }
  .seg-btn{
    padding:8px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface);
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .seg-btn.active{
    background:var(--ink);
    color:var(--bg);
    border-color:var(--ink);
  }
  .day-toggles{ display:flex; gap:6px; }
  .day-toggle{
    width:36px;height:36px;border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface);
    font-size:12px; font-weight:600;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .day-toggle.active{
    background:var(--accent-done);
    border-color:var(--accent-done);
    color:#fff;
  }
  .inline-row{ display:flex; align-items:center; gap:10px; }
  .stepper{ display:flex; align-items:center; gap:10px; }
  .stepper button{
    width:32px;height:32px;border-radius:8px;
    border:1px solid var(--line);
    background:var(--surface);
    font-size:16px;
    cursor:pointer;
  }
  .stepper span{ font-family:'IBM Plex Mono',monospace; font-weight:600; min-width:20px; text-align:center; }

  .sheet-actions{ display:flex; gap:10px; margin-top:8px; }
  .btn-primary{
    flex:1;
    background:var(--ink);
    color:var(--bg);
    border:none;
    border-radius:12px;
    padding:13px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-secondary{
    background:transparent;
    color:var(--accent-miss);
    border:1px solid var(--accent-miss-soft);
    border-radius:12px;
    padding:13px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }

  /* Stats / progress (used in Monthly tab) */
  .detail-dot{ width:14px;height:14px;border-radius:50%; flex-shrink:0; display:inline-block; }
  .name-badge{
    display:inline-flex;
    align-items:center;
    padding:4px 10px;
    border-radius:8px;
    font-weight:700;
    color:#fff;
    text-shadow: -1px -1px 0 rgba(0,0,0,0.55), 1px -1px 0 rgba(0,0,0,0.55), -1px 1px 0 rgba(0,0,0,0.55), 1px 1px 0 rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.35);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:100%;
  }
  .stat-row{ display:flex; gap:10px; margin-bottom:20px; }
  .stat-card{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px;
    text-align:center;
  }
  .stat-num{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; }
  .stat-label{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .progress-wrap{ margin-bottom:20px; }
  .progress-bar{
    height:8px; border-radius:4px;
    background:var(--surface-alt);
    overflow:hidden;
    margin-top:6px;
  }
  .progress-fill{ height:100%; border-radius:4px; }

  .month-cal{ margin-bottom:20px; }
  .month-cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
  }
  .cal-dow{ font-size:10px; color:var(--ink-faint); text-align:center; }
  .cal-cell{
    aspect-ratio:1;
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;
    color:var(--ink-faint);
    border:1px solid var(--line);
    cursor:pointer;
  }
  .cal-cell.empty{ border:none; cursor:default; }
  .cal-cell.future{ color:var(--ink-faint); border-style:dashed; cursor:default; }

  .monthly-habit-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; gap:10px; }
  .monthly-habit-name{
    font-family:'Fraunces',serif; font-weight:600; font-size:18px;
    display:flex; align-items:center; gap:8px; justify-content:center;
    flex:1; min-width:0;
  }
  .monthly-habit-name span.name-text{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .week-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .grid-wrap{ display:flex; flex-direction:column; gap:2px; }
  .grid-row{ display:grid; grid-template-columns: 1fr repeat(7, 32px); align-items:center; gap:4px; padding:4px 0; }
  .grid-header{ padding-bottom:6px; border-bottom:1px solid var(--line); margin-bottom:4px; }
  .grid-name-col{
    font-size:13px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    display:flex; align-items:center; gap:6px;
  }
  .grid-dot{ width:8px;height:8px;border-radius:50%; flex-shrink:0; }
  .grid-col-label{ font-size:10px; text-align:center; color:var(--ink-soft); line-height:1.3; }
  .grid-cell{
    position:relative;
    width:32px;height:32px;border-radius:8px;
    border:1px solid var(--line);
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
    cursor:pointer;
    color:var(--ink-faint);
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }
  .grid-cell.disabled{ opacity:0.25; cursor:default; }
  .grid-cell.done{ background:var(--accent-done-soft); border-color:var(--accent-done); color:var(--accent-done); }
  .grid-cell.miss{ background:var(--accent-miss-soft); border-color:var(--accent-miss); color:var(--accent-miss); }
  .grid-cell.has-note::after{
    content:'';
    position:absolute;
    top:3px; right:3px;
    width:5px; height:5px;
    border-radius:50%;
    background:var(--accent-gold);
  }
</style>
</head>
<body>
<div id="app">

  <!-- HABITS TAB -->
  <div class="tab-screen" id="tab-habits">
    <div class="screen-header">
      <div class="screen-title">Habits</div>
      <div class="screen-header-actions">
        <button class="btn-icon" title="Export CSV" onclick="exportCSV()">📤</button>
        <button class="btn-icon" title="Import CSV" onclick="document.getElementById('csv-file-input').click()">📥</button>
        <button class="btn-add" onclick="openAddSheet()">+ New</button>
      </div>
    </div>
    <input type="file" id="csv-file-input" accept=".csv" style="display:none" onchange="handleCSVFile(event)">
    <div class="habit-list" id="habits-list"></div>
    <div class="empty-state" id="habits-empty" style="display:none">
      <h2>No habits yet</h2>
      <p>Add your first one — set how often it should happen and how you want to track it. Drag the handle on any habit to reorder your list.</p>
    </div>
  </div>

  <!-- DAILY TAB -->
  <div class="tab-screen" id="tab-daily">
    <div class="topbar">
      <button class="nav-arrow" onclick="shiftDay(-1)" title="Previous day">‹</button>
      <div class="topbar-center" onclick="jumpToday()">
        <div class="topbar-date" id="today-label"></div>
        <div class="topbar-sub" id="today-sub"></div>
      </div>
      <button class="nav-arrow" onclick="shiftDay(1)" title="Next day">›</button>
    </div>
    <div class="summary" id="summary" style="display:none">
      <div class="summary-ring" id="summary-ring"></div>
      <div class="summary-text" id="summary-text"></div>
    </div>
    <div id="groups-container"></div>
    <div class="empty-state" id="daily-empty" style="display:none">
      <h2>No habits yet</h2>
      <p>Add habits from the Habits tab, then check them off here each day.</p>
    </div>
  </div>

  <!-- WEEKLY TAB -->
  <div class="tab-screen" id="tab-weekly">
    <div class="screen-header"><div class="screen-title">Weekly</div></div>
    <div id="weekly-content"></div>
  </div>

  <!-- MONTHLY TAB -->
  <div class="tab-screen" id="tab-monthly">
    <div class="screen-header"><div class="screen-title">Monthly</div></div>
    <div id="monthly-content"></div>
  </div>

</div>

<nav class="bottom-nav">
  <button class="nav-btn" id="nav-habits" onclick="switchTab('habits')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></svg>
    Habits
  </button>
  <button class="nav-btn" id="nav-daily" onclick="switchTab('daily')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="8 12 11 15 16 9"/></svg>
    Daily
  </button>
  <button class="nav-btn" id="nav-weekly" onclick="switchTab('weekly')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 11h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
    Weekly
  </button>
  <button class="nav-btn" id="nav-monthly" onclick="switchTab('monthly')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/><circle cx="8" cy="15" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="15" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="15" r="1" fill="currentColor" stroke="none"/></svg>
    Monthly
  </button>
</nav>

<div class="overlay" id="overlay" onclick="closeSheets()"></div>

<div class="sheet" id="add-sheet">
  <div class="sheet-handle"></div>
  <h3 id="add-sheet-title">New habit</h3>
  <div class="field">
    <label>Name</label>
    <input type="text" id="f-name" placeholder="e.g. Read 20 minutes" maxlength="60">
  </div>
  <div class="field">
    <label>Color</label>
    <div class="swatches" id="f-swatches"></div>
  </div>
  <div class="field">
    <label>Group</label>
    <select id="f-group"></select>

<script>
let state = { habits: [], groups: [], logs: {}, notes: {} };
let editingId = null;
let noteCtx = null;
let currentTab = 'daily';
let viewDate = new Date(); viewDate.setHours(0,0,0,0);
let weekViewStart = null;
let monthViewYear = null, monthViewMonth = null;
let monthlyHabitIndex = 0;
let dragCtx = null;
const STORAGE_KEY = 'habit-tracker-state';
const PALETTE = ['#D9793D','#3E6B4F','#BD4A45','#3B5A7A','#2E9E97','#6B4C7A'];
const DOW_SHORT = ['S','M','T','W','T','F','S'];
const DOW_LABEL = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ICON_CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"></polyline></svg>';
const ICON_X = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>';
const ICON_DRAG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const bigint = parseInt(h,16);
  const r=(bigint>>16)&255, g=(bigint>>8)&255, b=bigint&255;
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function dateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return dateStr(new Date()); }
function addDays(d,n){ const nd = new Date(d); nd.setDate(nd.getDate()+n); return nd; }

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign({habits:[],groups:[],logs:{},notes:{}}, parsed);
    }
  }catch(e){ console.error('Storage error', e); }
  renderApp();
}
function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ console.error('Storage error', e); }
}

/* ---------- tab navigation ---------- */
function renderApp(){
  document.querySelectorAll('.tab-screen').forEach(el=>el.classList.remove('active'));
  const active = document.getElementById('tab-'+currentTab);
  if(active) active.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(el=>el.classList.remove('active'));
  const navBtn = document.getElementById('nav-'+currentTab);
  if(navBtn) navBtn.classList.add('active');

  if(currentTab==='habits') renderHabitsTab();
  else if(currentTab==='daily') renderDailyTab();
  else if(currentTab==='weekly') renderWeeklyTab();
  else if(currentTab==='monthly') renderMonthlyTab();
}
function switchTab(tab){
  currentTab = tab;
  if(tab==='weekly' && !weekViewStart) weekViewStart = weekStart(new Date());
  if(tab==='monthly'){
    if(monthViewYear===null){ const n=new Date(); monthViewYear=n.getFullYear(); monthViewMonth=n.getMonth(); }
    if(monthlyHabitIndex>=state.habits.length) monthlyHabitIndex = Math.max(0, state.habits.length-1);
  }
  renderApp();
}
function openHabitInMonthly(habitId){
  const idx = state.habits.findIndex(h=>h.id===habitId);
  if(idx>=0) monthlyHabitIndex = idx;
  switchTab('monthly');
}

/* ---------- schedule / streak logic ---------- */
function needsResponse(habit, d){
  if(habit.schedule.type === 'days'){
    return habit.schedule.days.includes(d.getDay());
  }
  return true; // daily or count -> every day
}
function getLog(habit, ds){
  const h = state.logs[habit.id];
  return h ? h[ds] : undefined;
}
function setLog(habit, ds, val){
  if(!state.logs[habit.id]) state.logs[habit.id] = {};
  if(val === undefined){ delete state.logs[habit.id][ds]; }
  else{ state.logs[habit.id][ds] = val; }
}
function getNoteText(habitId, ds){
  return (state.notes[habitId] && state.notes[habitId][ds]) || '';
}
function setNoteText(habitId, ds, text){
  if(!state.notes[habitId]) state.notes[habitId] = {};
  const clean = (text || '').trim();
  if(clean){ state.notes[habitId][ds] = clean; }
  else { delete state.notes[habitId][ds]; }
}
function weekStart(d){ // Monday-based
  const nd = new Date(d);
  const day = (nd.getDay()+6)%7; // 0=Mon
  nd.setDate(nd.getDate()-day);
  nd.setHours(0,0,0,0);
  return nd;
}
function weekCount(habit, wkStart){
  let c=0;
  for(let i=0;i<7;i++){
    const ds = dateStr(addDays(wkStart,i));
    if(getLog(habit,ds)===true) c++;
  }
  return c;
}
function computeCurrentStreak(habit){
  const today = new Date();
  if(habit.schedule.type === 'count'){
    const target = habit.schedule.timesPerWeek;
    let streak = 0;
    let wk = weekStart(today);
    let cur = weekCount(habit, wk);
    if(cur >= target){ streak++; wk = addDays(wk,-7); }
    else { wk = addDays(wk,-7); }
    while(true){
      const c = weekCount(habit, wk);
      if(c >= target){ streak++; wk = addDays(wk,-7); }
      else break;
      if(streak > 1000) break;
    }
    return streak;
  }
  let streak = 0;
  let d = today;
  let first = true;
  while(true){
    const ds = dateStr(d);
    if(needsResponse(habit,d)){
      const v = getLog(habit,ds);
      if(v === true){ streak++; }
      else if(v === false){ break; }
      else if(first && ds === todayStr()){ /* today unanswered, skip without breaking */ }
      else { break; }
    }
    first = false;
    d = addDays(d,-1);
    if(streak > 5000) break;
    if(habit.createdAt && dateStr(d) < habit.createdAt.slice(0,10)) break;
  }
  return streak;
}
function computeBestStreak(habit){
  const dsSet = Object.keys(state.logs[habit.id] || {});
  if(dsSet.length === 0) return computeCurrentStreak(habit);
  dsSet.sort();
  const start = new Date(dsSet[0]);
  const end = new Date();
  if(habit.schedule.type === 'count'){
    let best=0, run=0;
    let wk = weekStart(start);
    const lastWk = weekStart(end);
    while(wk <= lastWk){
      const c = weekCount(habit, wk);
      if(c >= habit.schedule.timesPerWeek){ run++; best = Math.max(best,run); }
      else run = 0;
      wk = addDays(wk,7);
    }
    return Math.max(best, computeCurrentStreak(habit));
  }
  let best=0, run=0;
  let d = new Date(start);
  while(d <= end){
    if(needsResponse(habit,d)){
      const v = getLog(habit, dateStr(d));
      if(v === true){ run++; best = Math.max(best,run); }
      else if(v === false){ run = 0; }
    }
    d = addDays(d,1);
  }
  return Math.max(best, computeCurrentStreak(habit));
}
function scheduleLabel(habit){
  if(habit.schedule.type === 'daily') return 'Daily';
  if(habit.schedule.type === 'count') return habit.schedule.timesPerWeek + 'x / week';
  const days = habit.schedule.days.slice().sort();
  if(days.length === 7) return 'Daily';
  return days.map(d=>DOW_LABEL[d].slice(0,3)).join(', ');
}
function getHabitById(id){ return state.habits.find(h=>h.id===id); }
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- DAILY TAB ---------- */
function renderDailyTab(){
  const todayLabel = document.getElementById('today-label');
  const isToday = dateStr(viewDate) === todayStr();
  todayLabel.textContent = viewDate.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
  const subEl = document.getElementById('today-sub');
  if(isToday){
    subEl.textContent = state.habits.length + (state.habits.length===1 ? ' habit' : ' habits');
    subEl.onclick = null;
  } else {
    subEl.innerHTML = 'not today · <span style="text-decoration:underline;">jump to today</span>';
    subEl.onclick = (e)=>{ e.stopPropagation(); jumpToday(); };
  }

  const container = document.getElementById('groups-container');
  container.innerHTML = '';
  document.getElementById('daily-empty').style.display = state.habits.length ? 'none' : 'block';
  document.getElementById('summary').style.display = state.habits.length ? 'flex' : 'none';

  if(state.habits.length){
    let dueCount = 0, doneCount = 0;
    state.habits.forEach(h=>{
      if(needsResponse(h, viewDate)){
        dueCount++;
        if(getLog(h, dateStr(viewDate)) === true) doneCount++;
      }
    });
    const pct = dueCount ? Math.round(doneCount/dueCount*100) : 100;
    document.getElementById('summary-ring').style.setProperty('--pct', pct);
    document.getElementById('summary-text').innerHTML = '<b>'+doneCount+' of '+dueCount+'</b> done '+(isToday?'today':'that day');
  }

  const groupMap = {};
  state.groups.forEach(g=>groupMap[g.id]=[]);
  groupMap['__none__'] = [];
  state.habits.forEach(h=>{
    const gid = h.groupId && groupMap[h.groupId] ? h.groupId : '__none__';
    groupMap[gid].push(h);
  });
  const showHeaders = (state.groups.length > 0) && state.habits.some(h=>h.groupId);

  const sections = [...state.groups.map(g=>({id:g.id,name:g.name})), {id:'__none__', name:'Other'}];
  sections.forEach(sec=>{
    const habits = groupMap[sec.id] || [];
    if(!habits.length) return;
    const { pending, done } = sortHabits(habits);
    const sectionEl = document.createElement('div');
    sectionEl.className = 'group-section';
    if(showHeaders){
      const h = document.createElement('div');
      h.className = 'group-header';
      h.textContent = sec.name;
      sectionEl.appendChild(h);
    }
    const list = document.createElement('div');
    list.className = 'habit-list';
    pending.forEach(habit=>list.appendChild(renderHabitRow(habit)));
    if(done.length){
      const divider = document.createElement('div');
      divider.className = 'updated-divider';
      divider.innerHTML = '<span>Updated</span>';
      list.appendChild(divider);
      done.forEach(habit=>list.appendChild(renderHabitRow(habit)));
    }
    sectionEl.appendChild(list);
    container.appendChild(sectionEl);
  });
}
function shiftDay(n){ viewDate = addDays(viewDate, n); renderApp(); }
function jumpToday(){ viewDate = new Date(); viewDate.setHours(0,0,0,0); renderApp(); }
function sortHabits(habits){
  const pending = [], done = [];
  habits.forEach(h=>{
    const addressed = !needsResponse(h,viewDate) || getLog(h,dateStr(viewDate)) !== undefined;
    (addressed ? done : pending).push(h);
  });
  return { pending, done };
}
function renderHabitRow(habit){
  const row = document.createElement('div');
  const due = needsResponse(habit, viewDate);
  const val = getLog(habit, dateStr(viewDate));
  const addressed = !due || val !== undefined;
  row.className = 'habit-row' + (addressed ? ' addressed' : '');
  row.style.background = hexToRgba(habit.color, 0.9);
  row.style.borderColor = hexToRgba(habit.color, 1);
  row.onclick = ()=>openHabitInMonthly(habit.id);

  const main = document.createElement('div');
  main.className = 'habit-main';
  const streak = computeCurrentStreak(habit);
  const target = habit.target;
  let goalTxt = '';
  if(target.type === 'streak'){
    goalTxt = ' · ' + Math.min(streak,target.days) + '/' + target.days;
    if(streak >= target.days) goalTxt = ' · goal reached';
  }
  main.innerHTML = '<div class="habit-name">'+escapeHtml(habit.name)+'</div>'+
    '<div class="habit-meta"><span>'+scheduleLabel(habit)+'</span><span class="habit-streak">'+(streak>0?streak+'d':'—')+'</span>'+
    (goalTxt ? '<span>'+goalTxt+'</span>' : '')+'</div>';
  row.appendChild(main);

  const actions = document.createElement('div');
  actions.className = 'habit-actions';
  if(due){
    const checkBtn = document.createElement('button');
    checkBtn.className = 'btn-mark check' + (val===true ? ' active' : '');
    checkBtn.innerHTML = ICON_CHECK;
    checkBtn.onclick = (e)=>{ e.stopPropagation(); mark(habit, true); };
    const crossBtn = document.createElement('button');
    crossBtn.className = 'btn-mark cross' + (val===false ? ' active' : '');
    crossBtn.innerHTML = ICON_X;
    crossBtn.onclick = (e)=>{ e.stopPropagation(); mark(habit, false); };
    actions.appendChild(checkBtn);
    actions.appendChild(crossBtn);
  } else {
    const badge = document.createElement('div');
    badge.style.fontSize = '11px';
    badge.style.color = 'rgba(255,255,255,0.7)';
    badge.style.textShadow = '0 1px 2px rgba(0,0,0,0.25)';
    badge.textContent = 'not scheduled';
    actions.appendChild(badge);
  }
  row.appendChild(actions);
  return row;
}
function mark(habit, val){
  const ds = dateStr(viewDate);
  const cur = getLog(habit, ds);
  setLog(habit, ds, cur === val ? undefined : val);
  saveData();
  renderApp();
}

/* ---------- HABITS TAB (manage + drag reorder) ---------- */
function renderHabitsTab(){
  const container = document.getElementById('habits-list');
  container.innerHTML = '';
  document.getElementById('habits-empty').style.display = state.habits.length ? 'none' : 'block';
  state.habits.forEach(habit=>container.appendChild(renderHabitsTabRow(habit)));
}
function renderHabitsTabRow(habit){
  const row = document.createElement('div');
  row.className = 'habit-row';
  row.dataset.id = habit.id;
  row.style.background = hexToRgba(habit.color, 0.9);
  row.style.borderColor = hexToRgba(habit.color, 1);
  row.onclick = ()=>openAddSheet(habit.id);

  const handle = document.createElement('div');
  handle.className = 'drag-handle';
  handle.innerHTML = ICON_DRAG;
  handle.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); startDrag(e, habit.id); });
  row.appendChild(handle);

  const main = document.createElement('div');
  main.className = 'habit-main';
  const group = habit.groupId ? state.groups.find(g=>g.id===habit.groupId) : null;
  main.innerHTML = '<div class="habit-name">'+escapeHtml(habit.name)+'</div>'+
    '<div class="habit-meta"><span>'+scheduleLabel(habit)+'</span>'+(group ? '<span>· '+escapeHtml(group.name)+'</span>' : '')+'</div>';
  row.appendChild(main);

  const chevron = document.createElement('div');
  chevron.className = 'habit-chevron';
  chevron.textContent = '›';
  row.appendChild(chevron);

  return row;
}
function startDrag(e, habitId){
  e.preventDefault();
  const list = document.getElementById('habits-list');
  const rowEl = list.querySelector('.habit-row[data-id="'+habitId+'"]');
  if(!rowEl) return;
  const rows = [...list.querySelectorAll('.habit-row')];
  const rects = rows.map(r=>({id:r.dataset.id, rect:r.getBoundingClientRect()}));
  const rect = rowEl.getBoundingClientRect();

  const placeholder = document.createElement('div');
  placeholder.className = 'drag-placeholder';
  placeholder.style.height = rect.height+'px';
  rowEl.parentNode.insertBefore(placeholder, rowEl);

  dragCtx = { habitId, offsetY: e.clientY - rect.top, rects, rowEl, placeholder };

  rowEl.style.position = 'fixed';
  rowEl.style.left = rect.left+'px';
  rowEl.style.top = rect.top+'px';
  rowEl.style.width = rect.width+'px';
  rowEl.style.zIndex = 999;
  rowEl.style.pointerEvents = 'none';
  rowEl.classList.add('dragging');
  document.body.appendChild(rowEl);

  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragEnd);
}
function onDragMove(e){
  if(!dragCtx) return;
  dragCtx.rowEl.style.top = (e.clientY - dragCtx.offsetY)+'px';
}
function onDragEnd(e){
  if(!dragCtx) return;
  const y = e.clientY;
  const others = dragCtx.rects.filter(r=>r.id!==dragCtx.habitId);
  let targetIndex = others.length;
  for(let i=0;i<others.length;i++){
    const mid = others[i].rect.top + others[i].rect.height/2;
    if(y < mid){ targetIndex = i; break; }
  }
  const fromIdx = state.habits.findIndex(h=>h.id===dragCtx.habitId);
  const [moved] = state.habits.splice(fromIdx,1);
  const othersIds = others.map(o=>o.id);
  othersIds.splice(targetIndex,0,dragCtx.habitId);
  const byId = {}; state.habits.forEach(h=>byId[h.id]=h); byId[moved.id]=moved;
  state.habits = othersIds.map(id=>byId[id]);

  dragCtx.placeholder.remove();
  dragCtx.rowEl.remove();
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);
  dragCtx = null;
  saveData();
  renderHabitsTab();
}

/* ---------- add / edit sheet ---------- */
let fSchedType = 'daily';
let fTargetType = 'ongoing';
let fDays = [1,2,3,4,5];
let fCount = 3;
let fColor = PALETTE[0];

function populateGroupSelect(selectedId){
  const sel = document.getElementById('f-group');
  sel.innerHTML = '';
  state.groups.forEach(g=>{
    const opt = document.createElement('option');
    opt.value = g.id; opt.textContent = g.name;
    sel.appendChild(opt);
  });
  const noneOpt = document.createElement('option');
  noneOpt.value = '__none__'; noneOpt.textContent = 'No group';
  sel.appendChild(noneOpt);
  const newOpt = document.createElement('option');
  newOpt.value = '__new__'; newOpt.textContent = '+ New group';
  sel.appendChild(newOpt);
  sel.value = selectedId || '__none__';
  sel.onchange = ()=>{
    document.getElementById('f-newgroup-field').style.display = sel.value==='__new__' ? 'block' : 'none';
  };
  document.getElementById('f-newgroup-field').style.display = sel.value==='__new__' ? 'block' : 'none';
}
function renderSwatches(){
  const wrap = document.getElementById('f-swatches');
  wrap.innerHTML = '';
  PALETTE.forEach(c=>{
    const sw = document.createElement('div');
    sw.className = 'swatch' + (c===fColor ? ' selected' : '');
    sw.style.background = c;
    sw.onclick = ()=>{ fColor = c; renderSwatches(); };
    wrap.appendChild(sw);
  });
}
function renderDayToggles(){
  const wrap = document.getElementById('f-days');
  wrap.innerHTML = '';
  DOW_SHORT.forEach((label,i)=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'day-toggle' + (fDays.includes(i) ? ' active' : '');
    btn.textContent = label;
    btn.onclick = ()=>{
      if(fDays.includes(i)) fDays = fDays.filter(x=>x!==i);
      else fDays.push(i);
      renderDayToggles();
    };
    wrap.appendChild(btn);
  });
}
function setSegmented(groupId, val, cb){
  const wrap = document.getElementById(groupId);
  [...wrap.children].forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.val === val);
  });
  cb(val);
}
document.getElementById('f-schedule-type').addEventListener('click', e=>{
  if(e.target.classList.contains('seg-btn')){
    fSchedType = e.target.dataset.val;
    setSegmented('f-schedule-type', fSchedType, ()=>{});
    document.getElementById('f-days-field').style.display = fSchedType==='days' ? 'block' : 'none';
    document.getElementById('f-count-field').style.display = fSchedType==='count' ? 'block' : 'none';
  }
});
document.getElementById('f-target-type').addEventListener('click', e=>{
  if(e.target.classList.contains('seg-btn')){
    fTargetType = e.target.dataset.val;
    setSegmented('f-target-type', fTargetType, ()=>{});
    document.getElementById('f-streak-field').style.display = fTargetType==='streak' ? 'block' : 'none';
  }
});
function stepCount(delta){
  fCount = Math.max(1, Math.min(7, fCount+delta));
  document.getElementById('f-count-val').textContent = fCount;
}

function openAddSheet(habitId){
  editingId = habitId || null;
  const habit = editingId ? state.habits.find(h=>h.id===editingId) : null;
  document.getElementById('add-sheet-title').textContent = habit ? 'Edit habit' : 'New habit';
  document.getElementById('f-name').value = habit ? habit.name : '';
  fColor = habit ? habit.color : PALETTE[state.habits.length % PALETTE.length];
  fSchedType = habit ? habit.schedule.type : 'daily';
  fDays = habit && habit.schedule.type==='days' ? habit.schedule.days.slice() : [1,2,3,4,5];
  fCount = habit && habit.schedule.type==='count' ? habit.schedule.timesPerWeek : 3;
  fTargetType = habit ? habit.target.type : 'ongoing';
  document.getElementById('f-streak-days').value = habit && habit.target.type==='streak' ? habit.target.days : 30;
  document.getElementById('f-count-val').textContent = fCount;

  renderSwatches();
  renderDayToggles();
  populateGroupSelect(habit ? (habit.groupId || '__none__') : '__none__');
  document.getElementById('f-newgroup').value = '';
  setSegmented('f-schedule-type', fSchedType, ()=>{});
  setSegmented('f-target-type', fTargetType, ()=>{});
  document.getElementById('f-days-field').style.display = fSchedType==='days' ? 'block' : 'none';
  document.getElementById('f-count-field').style.display = fSchedType==='count' ? 'block' : 'none';
  document.getElementById('f-streak-field').style.display = fTargetType==='streak' ? 'block' : 'none';
  document.getElementById('f-delete-row').style.display = habit ? 'flex' : 'none';

  showSheet('add-sheet');
}
function saveHabit(){
  const name = document.getElementById('f-name').value.trim();
  if(!name){ document.getElementById('f-name').focus(); return; }
  let groupSel = document.getElementById('f-group').value;
  let groupId = null;
  if(groupSel === '__new__'){
    const newName = document.getElementById('f-newgroup').value.trim();
    if(newName){
      const existing = state.groups.find(g=>g.name.toLowerCase()===newName.toLowerCase());
      if(existing) groupId = existing.id;
      else{
        const g = {id:uid(), name:newName};
        state.groups.push(g);
        groupId = g.id;
      }
    }
  } else if(groupSel !== '__none__'){
    groupId = groupSel;
  }
  let schedule;
  if(fSchedType === 'daily') schedule = {type:'daily'};
  else if(fSchedType === 'days') schedule = {type:'days', days: fDays.length ? fDays.slice() : [1,2,3,4,5]};
  else schedule = {type:'count', timesPerWeek: fCount};

  let target;
  if(fTargetType === 'ongoing') target = {type:'ongoing'};
  else{
    const days = parseInt(document.getElementById('f-streak-days').value,10) || 30;
    target = {type:'streak', days: Math.max(2,days)};
  }

  if(editingId){
    const h = state.habits.find(x=>x.id===editingId);
    h.name = name; h.color = fColor; h.groupId = groupId;
    h.schedule = schedule; h.target = target;
  } else {
    state.habits.push({
      id: uid(), name, color: fColor, groupId, schedule, target,
      createdAt: new Date().toISOString()
    });
  }
  saveData();
  closeSheets();
  renderApp();
}
function deleteHabitFromForm(){
  if(!editingId) return;
  if(!confirm('Delete this habit and all its history?')) return;
  state.habits = state.habits.filter(h=>h.id!==editingId);
  delete state.logs[editingId];
  saveData();
  closeSheets();
  renderApp();
}

/* ---------- CSV import ---------- */
let importMap = null;

function handleCSVFile(event){
  const file = event.target.files[0];
  if(!file) return;
  Papa.parse(file, {
    header:true,
    skipEmptyLines:true,
    complete: function(results){
      importMap = buildImportMap(results.data);
      renderImportSheet();
      showSheet('import-sheet');
    },
    error: function(err){
      alert('Could not read that CSV: ' + err.message);
    }
  });
  event.target.value = '';
}
function buildImportMap(rows){
  const map = {};
  rows.forEach(r=>{
    const name = (r.HabitName || '').trim();
    const date = (r.CalendarDate || '').trim();
    if(!name || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
    if(!date.startsWith('2026-')) return;
    let val = parseFloat(r.Value);
    if(isNaN(val)) val = 0;
    const note = (r.CommentText || '').trim();
    if(!map[name]) map[name] = { rows:[], first:date, last:date };
    map[name].rows.push({date, val, note});
    if(date < map[name].first) map[name].first = date;
    if(date > map[name].last) map[name].last = date;
  });
  return map;
}
function renderImportSheet(){
  const sheet = document.getElementById('import-sheet');
  const names = Object.keys(importMap).sort((a,b)=>importMap[b].last.localeCompare(importMap[a].last));
  const cutoff = dateStr(addDays(new Date(), -60));

  let rowsHtml = '';
  names.forEach((name)=>{
    const info = importMap[name];
    const recent = info.last >= cutoff;
    const doneCount = info.rows.filter(r=>r.val>0).length;
    rowsHtml += '<label class="import-row">'+
      '<input type="checkbox" data-import-name="'+encodeURIComponent(name)+'" '+(recent?'checked':'')+'>'+
      '<div class="import-row-main"><div class="import-row-name">'+escapeHtml(name)+'</div>'+
      '<div class="import-row-meta">'+doneCount+' logged days · '+info.first+' to '+info.last+'</div></div>'+
      '</label>';
  });

  sheet.innerHTML =
    '<div class="sheet-handle"></div>'+
    '<h3>Import habits</h3>'+
    '<div class="habit-meta" style="margin-bottom:12px;">Found '+names.length+' habits with 2026 activity in your file. We\'ve pre-checked the ones you logged in the last 60 days — pick which to bring in. Existing habits with a matching name will have this history merged in, and any comment text comes in as day notes.</div>'+
    '<div class="import-toolbar"><button onclick="setAllImportChecks(true)">Select all</button><button onclick="setAllImportChecks(false)">Select none</button></div>'+
    '<div class="import-list" id="import-list">'+rowsHtml+'</div>'+
    '<div class="sheet-actions"><button class="btn-primary" onclick="confirmImport()">Import selected</button></div>';
}
function setAllImportChecks(val){
  document.querySelectorAll('#import-list input[type=checkbox]').forEach(cb=>cb.checked = val);
}
function confirmImport(){
  const checked = [...document.querySelectorAll('#import-list input[type=checkbox]:checked')]
    .map(cb=>decodeURIComponent(cb.dataset.importName));
  if(!checked.length){ closeSheets(); return; }

  checked.forEach(name=>{
    const info = importMap[name];
    let habit = state.habits.find(h=>h.name.toLowerCase() === name.toLowerCase());
    if(!habit){
      habit = {
        id: uid(), name, color: PALETTE[state.habits.length % PALETTE.length],
        groupId: null, schedule:{type:'daily'}, target:{type:'ongoing'},
        createdAt: info.first + 'T00:00:00.000Z'
      };
      state.habits.push(habit);
    } else if(!habit.createdAt || habit.createdAt.slice(0,10) > info.first){
      habit.createdAt = info.first + 'T00:00:00.000Z';
    }
    if(!state.logs[habit.id]) state.logs[habit.id] = {};
    info.rows.forEach(r=>{
      state.logs[habit.id][r.date] = r.val > 0;
      if(r.note) setNoteText(habit.id, r.date, r.note);
    });
  });

  importMap = null;
  saveData();
  closeSheets();
  renderApp();
}

/* ---------- CSV export ---------- */
function csvEscape(val){
  const s = String(val==null ? '' : val);
  if(/[",\n\r]/.test(s)){
    return '"'+s.replace(/"/g,'""')+'"';
  }
  return s;
}
function exportCSV(){
  if(!state.habits.length){
    alert('Add a habit first — there\'s nothing to export yet.');
    return;
  }
  const header = ['HabitName','HabitDescription','HabitCategory','CalendarDate','Value','CommentText'];
  const lines = [header.join(',')];

  state.habits.forEach(habit=>{
    const category = habit.groupId ? ((state.groups.find(g=>g.id===habit.groupId)||{}).name || '') : '';
    const dateSet = new Set();
    Object.keys(state.logs[habit.id] || {}).forEach(d=>dateSet.add(d));
    Object.keys(state.notes[habit.id] || {}).forEach(d=>dateSet.add(d));
    const dates = [...dateSet].sort();
    dates.forEach(ds=>{
      const val = getLog(habit, ds);
      const valStr = val===true ? '1.0' : val===false ? '0.0' : '';
      const note = getNoteText(habit.id, ds);
      lines.push([habit.name, '', category, ds, valStr, note].map(csvEscape).join(','));
    });
  });

  const csv = lines.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'habit-tracker-export-'+todayStr()+'.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* ---------- shared log cycling (Weekly + Monthly grids) ---------- */
function cycleLog(habitId, ds){
  const habit = getHabitById(habitId);
  if(!habit) return;
  const cur = getLog(habit, ds);
  let next;
  if(cur === undefined) next = true;
  else if(cur === true) next = false;
  else next = undefined;
  setLog(habit, ds, next);
  saveData();
  renderApp();
}

/* ---------- weekly grid: tap to cycle, long-press to add a note ---------- */
const LONG_PRESS_MS = 480;
const LONG_PRESS_MOVE_TOLERANCE = 10;
let cellPress = { timer:null, longPressed:false, habitId:null, ds:null, startX:0, startY:0 };

function cellPressClear(){
  if(cellPress.timer){ clearTimeout(cellPress.timer); cellPress.timer = null; }
}
document.addEventListener('pointerdown', (e)=>{
  const cell = e.target.closest('.grid-cell[data-habit]');
  if(!cell) return;
  cellPressClear();
  cellPress.longPressed = false;
  cellPress.habitId = cell.dataset.habit;
  cellPress.ds = cell.dataset.date;
  cellPress.startX = e.clientX;
  cellPress.startY = e.clientY;
  cellPress.timer = setTimeout(()=>{
    cellPress.longPressed = true;
    if(navigator.vibrate) navigator.vibrate(15);
    openNoteSheet(cellPress.habitId, cellPress.ds);
  }, LONG_PRESS_MS);
});
document.addEventListener('pointermove', (e)=>{
  if(!cellPress.timer) return;
  const dx = Math.abs(e.clientX - cellPress.startX);
  const dy = Math.abs(e.clientY - cellPress.startY);
  if(dx > LONG_PRESS_MOVE_TOLERANCE || dy > LONG_PRESS_MOVE_TOLERANCE) cellPressClear();
});
document.addEventListener('pointerup', cellPressClear);
document.addEventListener('pointercancel', cellPressClear);
document.addEventListener('pointerleave', cellPressClear, true);
document.addEventListener('click', (e)=>{
  const cell = e.target.closest('.grid-cell[data-habit]');
  if(!cell) return;
  if(cellPress.longPressed){
    e.preventDefault();
    e.stopPropagation();
    cellPress.longPressed = false;
    return;
  }
  cycleLog(cell.dataset.habit, cell.dataset.date);
}, true);

function openNoteSheet(habitId, ds){
  const habit = getHabitById(habitId);
  if(!habit) return;
  noteCtx = { habitId, ds };
  const d = new Date(ds+'T00:00:00');
  document.getElementById('note-sheet-title').textContent = habit.name;
  document.getElementById('note-sheet-date').textContent = d.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
  document.getElementById('note-text').value = getNoteText(habitId, ds);
  showSheet('note-sheet');
  setTimeout(()=>{ const el = document.getElementById('note-text'); if(el) el.focus(); }, 300);
}
function saveNote(){
  if(!noteCtx) return;
  setNoteText(noteCtx.habitId, noteCtx.ds, document.getElementById('note-text').value);
  saveData();
  closeSheets();
  renderApp();
}
function deleteNote(){
  if(!noteCtx) return;
  setNoteText(noteCtx.habitId, noteCtx.ds, '');
  saveData();
  closeSheets();
  renderApp();
}

/* ---------- WEEKLY TAB ---------- */
function shiftWeek(n){ weekViewStart = addDays(weekViewStart, 7*n); renderWeeklyTab(); }
function renderWeeklyTab(){
  const content = document.getElementById('weekly-content');
  const days = [...Array(7)].map((_,i)=>addDays(weekViewStart,i));
  const rangeLabel = days[0].toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' – ' + days[6].toLocaleDateString(undefined,{month:'short',day:'numeric'});
  let header = '<div class="week-nav"><button class="nav-arrow" onclick="shiftWeek(-1)">‹</button><div class="habit-meta">'+rangeLabel+'</div><button class="nav-arrow" onclick="shiftWeek(1)">›</button></div>';
  let dowRow = '<div class="grid-row grid-header"><div class="grid-name-col"></div>'+
    days.map(d=>'<div class="grid-col-label">'+DOW_SHORT[d.getDay()]+'<br><span style="font-size:9px;color:var(--ink-faint)">'+d.getDate()+'</span></div>').join('')+
    '</div>';
  let rows = '';
  if(!state.habits.length){
    rows = '<div class="habit-meta" style="padding:16px 4px;">No habits yet.</div>';
  } else {
    state.habits.forEach(habit=>{
      const cells = days.map(d=>{
        const ds = dateStr(d);
        const due = needsResponse(habit, d);
        const v = getLog(habit, ds);
        let cls = 'grid-cell', cellContent = '';
        if(!due){ cls += ' disabled'; }
        else if(v===true){ cls += ' done'; cellContent = '✓'; }
        else if(v===false){ cls += ' miss'; cellContent = '✕'; }
        if(due && getNoteText(habit.id, ds)) cls += ' has-note';
        const attrs = due ? ' data-habit="'+habit.id+'" data-date="'+ds+'"' : '';
        return '<div class="'+cls+'"'+attrs+'>'+cellContent+'</div>';
      }).join('');
      rows += '<div class="grid-row"><div class="grid-name-col"><span class="name-badge" style="background:'+hexToRgba(habit.color,0.9)+'">'+escapeHtml(habit.name)+'</span></div>'+cells+'</div>';
    });
  }
  content.innerHTML = header + '<div class="grid-wrap">'+dowRow+rows+'</div>'+
    '<div class="habit-meta" style="margin-top:14px;">Tap a cell to cycle: blank → done → missed → blank.</div>';
}

/* ---------- MONTHLY TAB (single habit, month + habit navigation) ---------- */
function shiftMonth(n){
  monthViewMonth += n;
  if(monthViewMonth < 0){ monthViewMonth = 11; monthViewYear--; }
  if(monthViewMonth > 11){ monthViewMonth = 0; monthViewYear++; }
  renderMonthlyTab();
}
function shiftMonthlyHabit(n){
  if(!state.habits.length) return;
  monthlyHabitIndex = (monthlyHabitIndex + n + state.habits.length) % state.habits.length;
  renderMonthlyTab();
}
function renderMonthlyTab(){
  const content = document.getElementById('monthly-content');
  if(!state.habits.length){
    content.innerHTML = '<div class="empty-state"><h2>No habits yet</h2><p>Add a habit from the Habits tab to see its monthly tracker here.</p></div>';
    return;
  }
  if(monthlyHabitIndex < 0) monthlyHabitIndex = state.habits.length - 1;
  if(monthlyHabitIndex >= state.habits.length) monthlyHabitIndex = 0;
  const habit = state.habits[monthlyHabitIndex];
  const streak = computeCurrentStreak(habit);
  const best = computeBestStreak(habit);

  let progressHtml = '';
  if(habit.target.type === 'streak'){
    const pct = Math.min(100, Math.round(streak/habit.target.days*100));
    progressHtml = '<div class="progress-wrap"><div class="habit-meta" style="display:flex;justify-content:space-between;">'+
      '<span>Goal: '+habit.target.days+'-day streak</span><span>'+Math.min(streak,habit.target.days)+'/'+habit.target.days+'</span></div>'+
      '<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%; background:'+habit.color+'"></div></div></div>';
  }

  const y = monthViewYear, m = monthViewMonth;
  const first = new Date(y,m,1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const monthLabel = first.toLocaleDateString(undefined,{month:'long', year:'numeric'});
  const dowRow = '<div class="cal-dow">M</div><div class="cal-dow">T</div><div class="cal-dow">W</div><div class="cal-dow">T</div><div class="cal-dow">F</div><div class="cal-dow">S</div><div class="cal-dow">S</div>';
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += '<div class="cal-cell empty"></div>';
  const today = new Date(); today.setHours(0,0,0,0);
  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(y,m,day); d.setHours(0,0,0,0);
    const ds = dateStr(d);
    const v = getLog(habit, ds);
    const scheduled = needsResponse(habit, d);
    const isFuture = d > today;
    let cls = 'cal-cell', style = '';
    if(isFuture){ cls += ' future'; }
    else if(!scheduled){ style = 'opacity:0.35; cursor:default;'; }
    else if(v===true){ style = 'background:var(--accent-done-soft); color:var(--accent-done); border-color:var(--accent-done);'; }
    else if(v===false){ style = 'background:var(--accent-miss-soft); border-color:var(--accent-miss); color:var(--accent-miss);'; }
    const click = (!isFuture && scheduled) ? " onclick=\"cycleLog('"+habit.id+"','"+ds+"')\"" : '';
    cells += '<div class="'+cls+'" style="'+style+'"'+click+'>'+day+'</div>';
  }

  content.innerHTML =
    '<div class="monthly-habit-nav">'+
      '<button class="nav-arrow" onclick="shiftMonthlyHabit(-1)" title="Previous habit">‹</button>'+
      '<div class="monthly-habit-name"><span class="name-badge" style="background:'+hexToRgba(habit.color,0.9)+'">'+escapeHtml(habit.name)+'</span></div>'+
      '<button class="nav-arrow" onclick="shiftMonthlyHabit(1)" title="Next habit">›</button>'+
    '</div>'+
    '<div class="habit-meta" style="justify-content:center; margin-bottom:16px;">'+scheduleLabel(habit)+' · habit '+(monthlyHabitIndex+1)+' of '+state.habits.length+'</div>'+
    '<div class="stat-row">'+
      '<div class="stat-card"><div class="stat-num">'+streak+'</div><div class="stat-label">current streak</div></div>'+
      '<div class="stat-card"><div class="stat-num">'+best+'</div><div class="stat-label">best streak</div></div>'+
    '</div>'+
    progressHtml+
    '<div class="week-nav"><button class="nav-arrow" onclick="shiftMonth(-1)">‹</button><div class="habit-meta">'+monthLabel+'</div><button class="nav-arrow" onclick="shiftMonth(1)">›</button></div>'+
    '<div class="month-cal-grid" style="margin-bottom:10px;">'+dowRow+cells+'</div>'+
    '<div class="habit-meta">Tap a day to mark it done or missed.</div>';
}

/* ---------- sheet helpers ---------- */
function showSheet(id){
  document.getElementById('overlay').classList.add('show');
  document.getElementById(id).classList.add('show');
}
function closeSheets(){
  document.getElementById('overlay').classList.remove('show');
  ['add-sheet','import-sheet','note-sheet'].forEach(id=>{
    document.getElementById(id).classList.remove('show');
  });
  editingId = null;
}

loadData();
